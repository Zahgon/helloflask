[project]
name = "helloflask"
version = "2.0.0"
description = "Hello, Flask!"
authors = [
    {name = "Grey Li", email = "withlihui@gmail.com"},
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
    "click>=8.1.7",
    "wtforms[email]>=3.1.2",
    "sqlalchemy>=2.0.30",
    "cachelib>=0.9.0",
    "webassets>=2.0",
    "fastapi-debug-toolbar>=0.6.3",
    "bleach>=6.1.0",
    "greenlet>=3.1.1",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[[tool.pdm.autoexport]]
filename = "requirements/docs.txt"
groups = ["docs"]
"without-hashes" = true

[[tool.pdm.autoexport]]
filename = "requirements/v2.txt"
groups = ["default", "dev"]
"without-hashes" = true

[dependency-groups]
dev = [
    "watchdog>=4.0.1",
    "faker>=25.8.0",
    "coverage>=7.5.3",
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.9",
]
docs = [
    "mkdocs-material>=9.5.26",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
